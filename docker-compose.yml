version: '3.8'

services:
  # PostgreSQL
  postgres:
    image: postgres:16
    container_name: interview-platform-postgres
    environment:
      POSTGRES_DB: interview_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - interview-platform-data:/var/lib/postgresql/data
    networks:
      - platform-network

  # Backend .NET 10
  backend:
    container_name: interview-platform-backend
    build:
      context: .
      dockerfile: src/InterviewPlatform.API/Dockerfile
    ports:
      - "5126:5126"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Подменяем строку подключения к БД на имя контейнера "postgres" вместо localhost
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=interview_platform;Username=postgres;Password=postgres
    depends_on:
      - postgres
    networks:
      - platform-network

  # 3. Frontend React
  frontend:
    container_name: interview-platform-frontend
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "3000:80" # Откроется на http://localhost:3000
    depends_on:
      - backend
    networks:
      - platform-network

volumes:
  interview-platform-data:

networks:
  platform-network:
    driver: bridge